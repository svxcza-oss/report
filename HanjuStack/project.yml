name: HanjuStack
options:
  deploymentTarget:
    macOS: "14.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: YES
schemes:
  HanjuStack:
    build:
      targets:
        HanjuStack: all
    archive:
      config: Release
targets:
  HanjuStack:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources/index.html
      - path: Resources/en.lproj
        type: folder
      - path: Resources/ko.lproj
        type: folder
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Mascots
        type: folder
      - path: Resources/Fonts
        type: folder
      - path: Resources/Assets.xcassets
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: 한 주 쌓기
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
        HanjuAppGroup: $(HANJU_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: Hanju
            CFBundleURLSchemes: [hanju]
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(HANJU_APP_GROUP)]
        com.apple.security.files.user-selected.read-write: true
        # WKWebView의 웹 콘텐츠 프로세스는 샌드박스에서 이 권한이 없으면 빈 화면이 돼요. 페이지는 로컬 파일만 열고 외부 주소는 막아요.
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HANJU_BUNDLE_ID)
        PRODUCT_NAME: HanjuStack
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HanjuWidget
        embed: true
  HanjuWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes: [entitlements.plist]
      - path: Shared
      - path: Resources/Fonts
        type: folder
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: 한 주 쌓기
        HanjuAppGroup: $(HANJU_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/entitlements.plist
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(HANJU_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HANJU_BUNDLE_ID).widget
        PRODUCT_NAME: HanjuWidget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
