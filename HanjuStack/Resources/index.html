<title>한 주 쌓기</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 나눔고딕 (SIL OFL, NHN) — 앱 안에 들어 있는 파일을 써요 */
@font-face{font-family:"Hanju Nanum";font-weight:400;src:local("NanumGothic"),url("Fonts/NanumGothic-Regular.ttf") format("truetype")}
@font-face{font-family:"Hanju Nanum";font-weight:600 700;src:local("NanumGothicBold"),url("Fonts/NanumGothic-Bold.ttf") format("truetype")}
@font-face{font-family:"Hanju Nanum";font-weight:800 900;src:local("NanumGothicExtraBold"),url("Fonts/NanumGothic-ExtraBold.ttf") format("truetype")}
/* Layout: one input line on top, the week well below. Adding a block drops it straight into the week. */
:root{
  --bg:#eceef5; --well:rgba(255,255,255,.55); --cell:rgba(40,50,80,.09); --fg:#1d2030; --muted:#5f6579; --line:rgba(40,50,80,.14); --accent:#3f6fd8; --bad:#d64541; --ghost:rgba(63,111,216,.2);
  --fixed:#8b91a3; --done:#b4b8c4; --t1:#24a9b8; --t2:#e6b21c; --t3:#8a56d3; --t4:#3fa55f; --t5:#dc4d4a; --t6:#3f6fd8; --t7:#e5852a;
  --f-display:"Hanju Nanum","NanumGothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Hanju Nanum","NanumGothic","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --slot-h:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12141b;--well:rgba(255,255,255,.06);--cell:rgba(255,255,255,.07);--fg:#e8eaf2;--muted:#9097ab;--line:rgba(255,255,255,.1);--accent:#7096f0;--bad:#f06a66;--ghost:rgba(112,150,240,.22);--fixed:#5f6578;--done:#3c4152;color-scheme:dark}}
:root[data-theme="dark"]{--fixed:#5f6578;--done:#3c4152;--bg:#12141b;--well:rgba(255,255,255,.06);--cell:rgba(255,255,255,.07);--fg:#e8eaf2;--muted:#9097ab;--line:rgba(255,255,255,.1);--accent:#7096f0;--bad:#f06a66;--ghost:rgba(112,150,240,.22);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* 투명 매트: soft color behind frosted panels (the Mac app shows its frosted window instead) */
body{background:radial-gradient(60vw 50vh at 10% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),radial-gradient(50vw 50vh at 100% 100%,color-mix(in srgb,var(--t7) 12%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
html.native,html.native body{background:transparent}
.frost{-webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) 130px;-webkit-text-size-adjust:100%}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.5px;margin:0;line-height:1}
.week{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.week button{background:var(--well);color:var(--fg);width:30px;height:30px;font-size:16px;line-height:1;padding:0}
.week .now{width:auto;padding:0 10px;font-size:12px}
.week>select{font:inherit;background:var(--well);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px}
.week span{min-width:96px;text-align:center}
form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#name{flex:1 1 220px;min-width:0;font:inherit;font-size:15px;color:var(--fg);background:var(--well);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
#name::placeholder{color:var(--muted)}
.dur{display:flex;align-items:center;gap:2px;background:var(--well);border-radius:10px;padding:4px;border:1px solid var(--line)}
.dur button{width:30px;height:30px;padding:0;font-size:18px;line-height:1;background:var(--bg);color:var(--fg);border-radius:7px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.dur button:disabled{opacity:.35;cursor:default}
.dur input{width:88px;text-align:center;font:inherit;font-size:14px;font-weight:600;color:var(--fg);background:none;border:0;border-radius:6px;padding:6px 2px;font-variant-numeric:tabular-nums}
.dur input:focus{background:var(--bg);outline:2px solid var(--accent)}
.blk .dup{position:absolute;right:2px;top:2px;display:none;font-style:normal;font-size:11px;line-height:16px;padding:0 4px;border-radius:4px;background:rgba(0,0,0,.28);color:#fff;cursor:copy;z-index:1}
.blk:hover .dup,.blk:focus-visible .dup{display:block}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
#add{background:var(--accent);color:#fff;font-weight:600;padding:11px 18px}
#add:hover{filter:brightness(1.08)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{overflow-x:auto}
.board{display:grid;grid-template-columns:64px repeat(7,minmax(64px,1fr));column-gap:4px;min-width:520px}
.dh{text-align:center;padding-bottom:6px;font-size:12px;color:var(--muted);line-height:1.25}
.dh b{display:block;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--fg)}
.dh.today b{color:var(--accent)}
.dh .clr{display:inline-block;margin-top:2px;font-size:10px;font-weight:600;color:#fff;background:var(--t4);border-radius:4px;padding:0 5px}
.times{position:relative}
.times span{position:absolute;right:4px;font-size:10px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.col{position:relative;height:calc(var(--slots) * var(--slot-h));background-color:var(--well);border:1px solid var(--line);border-radius:6px;
  background-image:linear-gradient(to bottom,var(--cell) 1px,transparent 1px);background-size:100% calc(var(--slot-h) * 6)}
.col{overflow:hidden}
.col.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.hours{display:flex;align-items:center;gap:4px;margin-left:8px}
.hours select{font:inherit;font-size:12px;color:var(--fg);background:var(--well);border:0;border-radius:8px;padding:6px 4px}
.clear{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.clear button.opt{background:var(--well);color:var(--fg);text-decoration:none;padding:6px 10px;border-radius:8px}
.clear button.opt.armed{background:var(--bad);color:#fff}
.blk{position:absolute;left:2px;right:2px;border-radius:4px;background:var(--c);color:var(--ink,#fff);padding:2px 6px;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);opacity:.93}
.blk::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.blk.short{font-size:9px;line-height:10px;padding:0 3px}
.blk span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk.done{background-color:var(--done);--ink:#fff;color:#fff}
.blk.fixed{background-color:var(--fixed);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 5px,transparent 5px 10px)}
.blk.fixed span::before{content:"↻ "}
.blk.carried:not(.done):not(.fixed) span::before{content:"↪ "}
.rep input{position:absolute;opacity:0;pointer-events:none}
.rep label{display:block;padding:11px 12px;border-radius:10px;background:var(--well);color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap}
.rep input:checked+label{background:var(--fixed);color:#fff;font-weight:600}
.rep input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.blk.done span::before{content:"✓ "}
.blk.lifted{opacity:.2}
.blk.drop{animation:fall .4s cubic-bezier(.3,.7,.4,1.15) both}
.blk.flash{animation:flash .45s ease-out}
@keyframes fall{from{transform:translateY(calc(-1 * var(--fall,200px)))}to{transform:none}}
@keyframes flash{from{box-shadow:inset 0 0 0 99px rgba(255,255,255,.9)}}
.ghost{position:absolute;left:2px;right:2px;border-radius:4px;border:2px dashed var(--accent);background:var(--ghost);pointer-events:none}
.ghost.bad{border-color:var(--bad)}
.float{position:fixed;z-index:50;pointer-events:none;opacity:.92}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.foot button{background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:12px}
.trash{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);border-radius:99px;padding:12px 22px;font-size:14px;font-weight:600;transition:transform .15s,background .15s}
.trash.over{background:var(--bad);color:#fff;transform:translateX(-50%) scale(1.08)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;pointer-events:none}
.mode{display:flex;background:var(--well);border-radius:10px;padding:3px;gap:2px}
.mode button{background:none;color:var(--muted);font-size:12px;padding:6px 10px;border-radius:7px}
.mode button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lesser{position:fixed;left:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;will-change:transform}
.lesser.flip canvas{transform:scaleX(-1)}
.lesser canvas{width:96px;height:96px;image-rendering:pixelated;cursor:pointer;pointer-events:auto}
.lesser .say{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:12px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.08)}
/* 공통 할 일: 오늘 / 이번 주 (시간 없이 체크만) */
.todos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.tl{background:var(--well);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;align-content:start}
.tl h2{margin:0;font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tl h2 small{font-weight:400;color:var(--muted);font-size:11px}
.tl ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tl li{display:flex;align-items:center;gap:8px;min-height:30px;border-radius:7px;padding:0 4px}
.tl li:hover{background:var(--cell)}
.tl li .ck{width:20px;height:20px;flex:none;border-radius:5px;border:1.5px solid var(--muted);background:none;padding:0;font-size:12px;line-height:1;color:#fff}
.tl li.done .ck{background:var(--t4);border-color:var(--t4)}
.tl li .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;font-size:14px}
.tl li.done .tx{color:var(--muted);text-decoration:line-through}
.tl li input.tx{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:4px 6px}
.tl li .del{background:none;color:var(--muted);padding:2px 6px;font-size:13px;opacity:0}
.tl li:hover .del,.tl li:focus-within .del{opacity:1}
@media (hover:none){.tl li .del{opacity:.6}}
.tl form{display:flex;flex-wrap:nowrap;align-items:stretch;gap:6px}
.tl .tl-plus{flex:none;width:36px;padding:0;background:var(--accent);color:#fff;font-size:18px;font-weight:700;border-radius:8px}
.tl form input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
/* 레서와 대화 */
.chat{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(124px + env(safe-area-inset-bottom,0px));z-index:45;width:min(380px,calc(100vw - 32px));height:min(540px,calc(100vh - 170px));display:flex;flex-direction:column;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.2);overflow:hidden}
.chat header{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line)}
.chat header div{flex:1;min-width:0;display:grid;line-height:1.25}
.chat header b{font-size:14px}
.chat header small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat header button{background:var(--well);color:var(--fg);padding:5px 8px;font-size:12px;border-radius:7px;white-space:nowrap}
.chat .log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.chat .msg{max-width:86%;padding:8px 11px;border-radius:13px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.chat .msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.chat .msg.bot{align-self:flex-start;background:var(--well);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat .msg.note{align-self:center;max-width:100%;background:none;color:var(--muted);font-size:11px;padding:0;text-align:center}
.chat .msg.typing{color:var(--muted)}
.chat .hints{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.chat .hints button{background:var(--well);color:var(--fg);border:1px solid var(--line);font-size:12px;padding:5px 9px;border-radius:99px}
.chat form{display:flex;flex-wrap:nowrap;align-items:stretch;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chat form input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--fg);background:var(--well);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.chat form button{background:var(--accent);color:#fff;font-weight:600;padding:0 14px}
.chat form button:disabled{opacity:.5}
.chat .set{padding:10px 14px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px;font-size:12px;background:var(--well)}
.chat .set label{display:grid;gap:4px;color:var(--muted)}
.chat .set select,.chat .set input{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.chat .set .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chat .set .row button{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:6px 10px;font-size:12px;border-radius:8px}
.chat .set p{margin:0;color:var(--muted);line-height:1.45}
/* 챌린지: N일 계획 + 날마다 체크. 그날 채운 만큼 그릇(비커·물병·화분)이 차올라요 */
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.ch{gap:8px}
.ch-head{display:flex;gap:10px;align-items:center}
.ch-head .vs-big{flex:none;width:32px;height:42px;color:var(--fg)}
.ch-head .vs-big svg{width:32px;height:42px}
.ch-head>div{flex:1;min-width:0;display:grid;gap:2px}
.ch-name{font-weight:800;font-size:14px;cursor:text;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-name-in{font:inherit;font-weight:800;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:3px 6px;min-width:0}
.ch-sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-pct{font:800 20px var(--f-display);font-variant-numeric:tabular-nums}
.ch-badges{display:flex;gap:6px;flex-wrap:wrap}
.ch-badge{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--cell)}
.ch-badge.late{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.ch-days{display:flex;gap:2px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
.ch-day{flex:none;display:grid;justify-items:center;gap:1px;background:none;padding:3px 1px;border-radius:6px;color:var(--muted);font-size:10px;width:24px}
.ch-day svg{width:14px;height:19px;color:var(--muted)}
.ch-day.on{background:var(--cell);color:var(--fg)}
.ch-day.today b{color:var(--accent)}
.ch li .tx{cursor:pointer}
.ch li .tx em{font-style:normal;font-size:11px;color:var(--muted)}
.ch-link{flex:none;background:none;color:var(--accent);padding:2px 6px;font-size:14px}
.ch-empty{color:var(--muted);font-size:13px}
.ch-behind summary{cursor:pointer;font-size:12px;color:var(--muted);padding:2px 4px}
.ch-behind ul{margin-top:4px}
.ch-foot{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ch-foot button{background:none;color:var(--muted);font-size:11px;padding:4px 7px;border:1px solid var(--line);border-radius:6px}
.ch-foot button.armed{color:var(--bad);border-color:var(--bad)}
.ch-new{border:1.5px dashed var(--line);background:none;border-radius:10px;padding:14px;color:var(--fg);font-weight:700;font-size:13px;display:grid;gap:4px;justify-items:center;align-content:center;min-height:64px}
.ch-new small{font-weight:400;color:var(--muted);font-size:11px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,12,20,.35);display:grid;place-items:center;padding:16px}
.sheet form{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;width:min(500px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:14px;display:grid;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet header b{font-size:15px}
.sheet header button{background:var(--well);color:var(--fg);padding:5px 9px;border-radius:7px}
.sheet label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.sheet input,.sheet select,.sheet textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--well);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
.sheet textarea{resize:vertical;min-height:150px;line-height:1.45}
.sheet .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.sheet .go{background:var(--accent);color:#fff;font-weight:700;padding:10px}
.ch-tpl{display:flex;gap:6px;flex-wrap:wrap}
.ch-tpl button{background:var(--well);color:var(--fg);border:1px solid var(--line);font-size:12px;padding:6px 10px;border-radius:99px}
.ch-tpl button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.ch-preview{margin:0;font-size:12px;color:var(--muted);white-space:pre-line}
/* 아이폰 날짜 칸은 기본 최소 폭이 있어서 칸 밖으로 넘쳐요 → 모양을 없애고 칸에 맞춰요 */
.sheet input[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:38px;line-height:1.2;text-align:left}
.sheet input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
.sheet input[type="date"]::-webkit-calendar-picker-indicator{margin:0}
.ch-seg{display:flex;background:var(--well);border-radius:9px;padding:3px;gap:2px}
.ch-seg button{flex:1;background:none;color:var(--muted);font-size:12px;padding:7px 8px;border-radius:7px}
.ch-seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ch-tip{display:flex;gap:9px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.5}
.ch-tip img{width:34px;height:34px;image-rendering:pixelated;flex:none}
.ch-tip p{margin:0 0 6px}
.ch-tip button{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:7px}
.ch-rows{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:min(46vh,360px);overflow:auto}
.ch-rows li{display:grid;grid-template-columns:46px minmax(0,1fr) minmax(0,2fr) 26px;gap:6px;align-items:center}
.ch-rows b{font-size:12px;color:var(--muted)}

<script>
(()=>{
const KEY='hanju-ssakgi-v2';
const NATIVE=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.native);
const $=id=>document.getElementById(id), board=$('board');
if(NATIVE&&window.hanjuPlatform!=='ios')document.documentElement.classList.add('native');
if(window.hanjuPlatform==='ios')document.querySelector('meta[name=viewport]').setAttribute('content','width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');

let S, drag=null, wk=0, saveInFlight=false, saveQueued=false;
const slotH=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--slot-h'))||10;
let safeProbe=null;
function fitSlots(){ // 좁은 화면: 일주일 판 아래 끝이 화면 아래 끝에 딱 맞게 한 칸 높이를 정해요
  const root=document.documentElement;if(innerWidth>700){root.style.removeProperty('--slot-h');return}
  if(!safeProbe){safeProbe=document.createElement('div');safeProbe.style.cssText='position:fixed;visibility:hidden;pointer-events:none;height:env(safe-area-inset-bottom,0px)';document.body.appendChild(safeProbe)}
  const top=board.getBoundingClientRect().top+scrollY,head=board.querySelector('.dh')?.getBoundingClientRect().height||30;
  const avail=innerHeight-top-head-safeProbe.getBoundingClientRect().height-10;
  root.style.setProperty('--slot-h',Math.max(2.5,Math.min(10,avail/ROWS())).toFixed(2)+'px')}
const at=h=>h*6; // v4: ten-minute slots from midnight
const FROM=()=>S.range.from*6, TO=()=>S.range.to*6, ROWS=()=>TO()-FROM();
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const language=()=>S?.language||((navigator.language||'ko').toLowerCase().startsWith('ko')?'ko':'en');
const T=(ko,en)=>language()==='en'?en:ko;
const days=()=>T(['월','화','수','목','금','토','일'],['Mon','Tue','Wed','Thu','Fri','Sat','Sun']);
const hm=s=>{const m=s*10,h=Math.floor(m/60),minutes=String(m%60).padStart(2,'0');return language()==='en'?`${h%12||12}:${minutes} ${h%24<12?'AM':'PM'}`:`${h}:${minutes}`};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const todayIdx=()=>(new Date().getDay()+6)%7;
function weekDates(offset){const m=today();m.setDate(m.getDate()-todayIdx()+offset*7);return [...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d})}
const dayName=k=>days()[(new Date(k+'T00:00').getDay()+6)%7];

function sample(){
  const w=weekDates(0).map(key), t=todayIdx(), d=k=>w[Math.min(6,t+k)];
  const b=(name,len,c,date,h,done=false)=>({id:uid(),name,len,c,date,start:h*2,done,sample:true});
  const f=(name,len,wd,h)=>({id:uid(),name,len,wd,start:h*2,fixed:true,sample:true});
  return {v:3,theme:'light',mascot:'planner',lesser:true,range:{from:8,to:24},n:5,fixed:[f(T('전공 수업','Lecture'),4,0,10),f(T('전공 수업','Lecture'),4,2,10)],blocks:[b(T('PCCP 기출 2문제','Practice two problems'),2,1,d(0),20),b(T('비트코인 원문 과제','Read a paper'),4,3,d(1),19),b(T('HWP 변환 테스트','Work on a project'),2,4,d(2),15),b(T('의자 보러 가기','Run an errand'),3,7,d(3),13),b(T('철학책 읽기','Read a book'),2,2,d(0),22,true)]};
}
function migrate(v){ // older saves kept a weekday index, and counted time from 8시
  const w=weekDates(0).map(key);
  if(!Array.isArray(v.fixed))v.fixed=[];
  if((v.v||0)<3){[...v.blocks,...v.fixed].forEach(b=>b.start=(b.start||0)+16);v.v=3;v._m=true}
  if(!v.range||!(v.range.to>v.range.from))v.range={from:8,to:24};
  if(v.v<4){[...v.blocks,...v.fixed].forEach(b=>{b.start*=3;b.len*=3});v.v=4;v._m=true}
  if(!['ko','en'].includes(v.language)){v.language=(navigator.language||'ko').toLowerCase().startsWith('ko')?'ko':'en';v._m=true}
  if(Object.prototype.hasOwnProperty.call(v,'timeFormat')){delete v.timeFormat;v._m=true}
  if(!Array.isArray(v.todos))v.todos=[];
  if(!Array.isArray(v.challenges))v.challenges=[];
  if(!v.ai||typeof v.ai!=='object')v.ai={provider:'auto',models:{}};if(!['auto','apple','anthropic','openai','script'].includes(v.ai.provider))v.ai.provider='auto';if(!v.ai.models||typeof v.ai.models!=='object')v.ai.models={};
  if(v.theme!=='saver')v.theme='light';if(v.mascot!=='passion')v.mascot='planner';if(v.lesser!==false)v.lesser=true;if(v.rollover!==false)v.rollover=true;
  v.blocks.forEach(b=>{if(!b.date&&b.day!=null){b.date=w[b.day]}delete b.day});
  v.blocks=v.blocks.filter(b=>b.date);if(typeof v.n!=='number')v.n=v.blocks.length;
  v.fixed.forEach(f=>f.fixed=true);return v;
}
function load(){
  if(NATIVE&&window.savedState&&Array.isArray(window.savedState.blocks))return migrate(window.savedState);
  try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.blocks))return migrate(v)}catch(e){}
  return migrate(sample());
}
function save(){
  stampChanges();
  if(NATIVE){if(saveInFlight){saveQueued=true;return}saveInFlight=true;window.webkit.messageHandlers.native.postMessage({action:'save',state:S});return}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
/* 바뀐 항목에만 시각(u)을 찍고, 지운 항목은 deleted에 남겨요. 그래야 다른 기기·위젯과 항목 단위로 합칠 수 있어요. */
const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v);
const SETTINGS=['theme','mascot','lesser','range','language','ai','rollover'];
let snap=null,snapSettings=null;
function snapshot(){const m=new Map();for(const k of ['blocks','fixed','todos','challenges'])for(const r of S[k]||[]){const {u,...rest}=r;m.set(r.id,k+canon(rest))}return m}
function settingsSig(){return canon(Object.fromEntries(SETTINGS.map(k=>[k,S[k]])))}
function rememberSaved(){snap=snapshot();snapSettings=settingsSig()}
function stampChanges(){
  if(!snap){rememberSaved();return}
  const now=Date.now(),cur=snapshot();
  for(const k of ['blocks','fixed','todos','challenges'])for(const r of S[k]||[])if(snap.get(r.id)!==cur.get(r.id))r.u=now;
  for(const id of snap.keys())if(!cur.has(id)){if(!S.deleted||typeof S.deleted!=='object')S.deleted={};S.deleted[id]=now}
  const sig=settingsSig();if(sig!==snapSettings)S._settingsAt=now;
  rememberSaved();
}
const wdOf=k=>(new Date(k+'T00:00').getDay()+6)%7;
const find=id=>S.blocks.find(b=>b.id===id)||S.fixed.find(b=>b.id===id);
const onDay=k=>[...S.fixed.filter(f=>f.wd===wdOf(k)),...S.blocks.filter(b=>b.date===k)];
const fits=(date,start,len,ex)=>start>=0&&start+len<=144&&!onDay(date).some(o=>o.id!==ex&&o.start<start+len&&start<o.start+o.len);
function spot(len){ // least-stacked day (from today on, in the week on screen), earliest free cell in the visible hours
  const days=weekDates(wk).map(key), from=wk===0?todayIdx():0;let best=null;
  if(wk<0)return null;
  for(let i=from;i<7;i++){const d=days[i];for(let s=FROM();s+len<=TO();s++)if(fits(d,s,len)){const l=onDay(d).reduce((a,x)=>a+x.len,0);if(!best||l<best.l)best={d,s,l};break}}
  return best;
}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1600)}

function clearLabel(kind){return kind==='all'?T('전체 지우기','Delete all'):kind==='blocks'?T('고정 빼고 지우기','Delete tasks only'):T('고정만 지우기','Delete repeats only')}
function applyLanguage(){
  document.documentElement.lang=language();document.title=T('한 주 쌓기','HanjuStack');
  const text={'h1':['한 주 쌓기','HanjuStack'],'#m-light':['☀︎ 라이트','☀︎ Light'],'#m-saver':['☾ 절전','☾ Dark'],'#now':['이번 주','This week'],'#add':['쌓기','Stack'],'#clear':['지우기','Delete'],'.rep label':['↻ 매주 고정','↻ Repeat weekly'],'#trash':['여기로 끌어서 삭제','Drop here to delete'],'.foot>span':['누르면 완료 · 끌어서 옮기기 · ⧉ 또는 ⌥(option) 누르고 끌면 복제 · 휴지통으로 끌면 삭제 · 회색 ↻는 매주 고정','Click to complete · drag to move · ⧉ or Option-drag to duplicate · drag to trash to delete · gray ↻ repeats weekly']};
  for(const [selector,labels] of Object.entries(text))document.querySelector(selector).textContent=T(...labels);
  const aria={'#prev':['지난주','Previous week'],'#next':['다음 주','Next week'],'#from':['하루 시작 시간','Day starts'],'#to':['하루 끝 시간','Day ends'],'#name':['할 일','Task'],'#dm':['10분 줄이기','Decrease by 10 minutes'],'#dp':['10분 늘리기','Increase by 10 minutes'],'#dur':['걸리는 시간','Duration']};
  for(const [selector,labels] of Object.entries(aria))document.querySelector(selector).setAttribute('aria-label',T(...labels));
  $('name').placeholder=T('할 일 입력 (예: PCCP 기출 2문제)','Add a task (e.g. practice two problems)');
  $('dur').title=T('직접 입력: 1:30 · 90분 · 1.5 · 2시간','Enter 1:30 · 90 min · 1.5 · 2h');
  document.querySelector('.rep label').title=T('매주 같은 요일·시간에 반복돼요','Repeats at the same time every week');
  document.querySelector('.mode').setAttribute('aria-label',T('화면 모드','Appearance'));

function dupe(id){ // same day right after the original, else anywhere free that day, else the next open day
  const b=find(id);if(!b)return;
  const date=b.fixed?key(weekDates(wk)[b.wd]):b.date;let s=null;
  for(let t=b.start+b.len;t+b.len<=TO();t++)if(fits(date,t,b.len)){s=t;break}
  if(s==null)for(let t=FROM();t+b.len<=TO();t++)if(fits(date,t,b.len)){s=t;break}
  let d=date;if(s==null){const p=spot(b.len);if(!p){toast(T('복제할 빈칸이 없어요','No free slot to duplicate this block'));return}d=p.d;s=p.s}
  const c=copyOf(b,d,s);save();render(c.id);toast(T(`복제했어요 · ${dayName(d)} ${hm(s)}`,`Duplicated · ${dayName(d)} ${hm(s)}`));
  board.querySelector(`[data-id="${c.id}"]`)?.focus({preventScroll:true})}
function remove(id){S.blocks=S.blocks.filter(b=>b.id!==id);S.fixed=S.fixed.filter(b=>b.id!==id);save();render();toast(T('삭제했어요','Deleted'))}
function showDate(k){const d=new Date(k+'T00:00');if(isNaN(d))return;
  const monD=new Date(d);monD.setDate(d.getDate()-((d.getDay()+6)%7));const monT=weekDates(0)[0];
  wk=Math.round((monD-monT)/(7*864e5));render()}
window.hanjuToggle=id=>{const b=find(id);if(!b)return;showDate(b.date);toggle(id)};
window.hanjuShowDate=showDate;
window.hanjuLoad=state=>{if(state&&Array.isArray(state.blocks)&&!drag&&!saveInFlight){const was=new Set(S.blocks.filter(b=>b.done).map(b=>b.id));S=migrate(state);rememberSaved();const migrated=S._m;delete S._m;if(migrated)save();
  S.blocks.filter(b=>b.done&&!was.has(b.id)&&b.date===key(today())).forEach(()=>L.celebrate());applyMode();render();return true}return false};
window.hanjuDidSave=revision=>{S._revision=revision;saveInFlight=false;if(saveQueued){saveQueued=false;save()}};
window.hanjuSaveRejected=()=>{saveInFlight=false;saveQueued=false};

  if($('rep').checked){const f={id:uid(),name,len,wd:wdOf(p.d),start:p.s,fixed:true};S.fixed.push(f);$('name').value='';$('rep').checked=false;save();render(f.id);toast(T(`매주 ${dayName(p.d)} ${hm(p.s)} 고정 · 끌어서 원하는 시간으로 옮겨요`,`Repeats every ${dayName(p.d)} at ${hm(p.s)} · drag to adjust`));return}

});
/* ---------- 걸리는 시간: − / + 로 10분씩, 또는 직접 입력 ---------- */
let dur=6; // ten-minute slots
const durText=n=>{const mins=n*10,h=Math.floor(mins/60),m=mins%60;return language()==='en'?(h&&m?`${h}h ${m}min`:h?`${h}h`:`${m}min`):(h&&m?`${h}시간 ${m}분`:h?`${h}시간`:`${m}분`)};
function parseDur(t){
  t=String(t).trim().replace(/\s+/g,'');if(!t)return null;let m;
  if(m=t.match(/^(\d{1,2}):(\d{1,2})$/))return(+m[1]*60+ +m[2]);
  if(m=t.match(/^(?:(\d+(?:\.\d+)?)(?:시간|h))?(?:(\d+)(?:분|m(?:in)?)?)?$/i)){
    if(m[1]==null&&m[2]==null)return null;
    if(m[1]==null){const v=+m[2];return /분|m/i.test(t)||v>12?v:v*60} // bare "3" = 3시간, "90" = 90분
    return(+m[1])*60+(m[2]?+m[2]:0)}
  if(m=t.match(/^(\d*\.\d+)$/))return +m[1]*60;
  return null}
function setDur(n){dur=Math.max(1,Math.min(144,n));$('dur').value=durText(dur);$('dm').disabled=dur<=1;$('dp').disabled=dur>=144}
function readDur(){const v=parseDur($('dur').value);if(v!=null&&v>0){setDur(Math.ceil(v/10));if(v%10)toast(T('10분 단위로 올림해요 · ','Rounded up to 10 minutes · ')+durText(dur))}else setDur(dur);return dur}
$('dm').onclick=()=>setDur(readDur()-1);$('dp').onclick=()=>setDur(readDur()+1);
$('dur').addEventListener('focus',e=>e.target.select());
$('dur').addEventListener('change',()=>{const v=parseDur($('dur').value);if(v==null)toast(T('예: 1:30 · 90분 · 2시간','Try 1:30 · 90 min · 2h'));readDur()});
$('dur').addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();setDur(readDur()+1)}else if(e.key==='ArrowDown'){e.preventDefault();setDur(readDur()-1)}});

function down(e){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const el=e.currentTarget,b=find(el.dataset.id),r=el.getBoundingClientRect();
  drag={b,el,copy:e.altKey,x0:e.clientX,y0:e.clientY,grab:Math.max(0,Math.min(b.len-1,Math.floor((e.clientY-r.top)/slotH()))),moved:false};
  el.setPointerCapture(e.pointerId);el.onpointermove=move;el.onpointerup=up;el.onpointercancel=()=>{end();drag=null;render()};
}
function move(e){
  if(!drag.moved){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;drag.moved=true;
    const w=drag.el.getBoundingClientRect().width,cl=drag.el.cloneNode(true);cl.className='blk float';cl.style.width=w+'px';cl.style.top=cl.style.left='0';
    document.body.appendChild(cl);drag.cl=cl;if(!drag.copy)drag.el.classList.add('lifted');$('trash').hidden=false}
  const h=slotH(),w=parseFloat(drag.cl.style.width);
  drag.cl.style.transform=`translate(${e.clientX-w/2}px,${e.clientY-drag.grab*h-h/2}px) rotate(-2deg)`;
  const tr=$('trash').getBoundingClientRect(),inTrash=e.clientX>=tr.left-10&&e.clientX<=tr.right+10&&e.clientY>=tr.top-10&&e.clientY<=tr.bottom+10;
  $('trash').classList.toggle('over',inTrash);drag.t=inTrash?{trash:1}:null;ghost(null);
  if(inTrash)return;
  for(const col of board.querySelectorAll('.col')){const r=col.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top-h&&e.clientY<=r.bottom+h){
      const date=col.dataset.date,start=Math.max(FROM(),Math.min(TO()-drag.b.len,FROM()+Math.floor((e.clientY-r.top)/h)-drag.grab)),ok=fits(date,start,drag.b.len,drag.copy?null:drag.b.id);
      drag.t={date,start,ok};ghost(col,start,ok);return}}
}
function ghost(col,start,ok){
  if(!col){drag.g&&drag.g.remove();drag.g=null;return}
  if(!drag.g){drag.g=document.createElement('div');drag.g.className='ghost'}
  col.appendChild(drag.g);const h=slotH();drag.g.style.top=(start-FROM())*h+'px';drag.g.style.height=drag.b.len*h+'px';drag.g.classList.toggle('bad',!ok);
}
function end(){drag.el.onpointermove=drag.el.onpointerup=drag.el.onpointercancel=null;drag.cl&&drag.cl.remove();drag.g&&drag.g.remove();$('trash').hidden=true;$('trash').classList.remove('over')}
function up(){
  const {b,moved,t,copy}=drag;end();drag=null;
  if(!moved){toggle(b.id);return}
  if(t&&t.trash){if(copy){render();return}remove(b.id);return}
  if(copy&&t&&t.ok){const c=copyOf(b,t.date,t.start);save();render(c.id);toast(`복제했어요 · ${dayName(t.date)} ${hm(t.start)}`);return}
  if(t&&t.ok){if(b.fixed){b.wd=wdOf(t.date)}else{b.date=t.date}b.start=t.start;save();render(b.id);if(b.fixed)toast(T(`매주 ${dayName(t.date)} ${hm(t.start)}로 옮겼어요`,`Moved repeat · ${dayName(t.date)} ${hm(t.start)}`));return}
  if(t)toast(T('다른 블록과 겹쳐요','Overlaps another block'));render();
}

/* ---------- 레서: PlanLess companion.js의 그림·시선·깜빡임 로직을 그대로 옮김 ---------- */
const L=(()=>{
  const TIMINGS={"planner":{"working":[280,160,300,240,280,240],"complete":[180,160,120,280,160,600],"idle":[140,140,140,140,140,140,140,140,140,70,90,70]},"passion":{"working":[260,160,140,300,200,260],"complete":[180,160,120,280,160,600],"idle":[140,140,140,140,140,140,140,140,140,70,90,70]}};
  const canvas=$('lesser-art'),ctx=canvas.getContext('2d'),say=$('say');
  let images={},ready=false,lastDraw='',pointer={x:0,y:0},smooth={x:0,y:0},gazeCol=1,gazeRow=1,lastTurn=0;
  let mode='idle',modeStart=performance.now(),celebStart=null,queue=0,raf=0;
  // 앱 안에서 돌아다니기: 화면 아래쪽을 오가다가 가끔 멈춰서 쉬어요
  const box=$('lesser');let x=null,target=0,pauseUntil=0,lastT=0,walkStart=0;
  const span=()=>Math.max(0,innerWidth-110);
  function place(){if(x==null){x=span()-20;target=20+Math.random()*(span()-40)}box.style.transform=`translateX(${Math.round(x)}px)`}
  const names=()=>({planner:T('계획단장 레서','Planner Lesser'),passion:T('열정 레서','Passion Lesser')});
  function frameAt(time,times){let pos=Math.max(0,time)%times.reduce((a,b)=>a+b,0);for(let i=0;i<times.length;i++){if(pos<times[i])return i;pos-=times[i]}return 0}
  function nowBlock(){const d=new Date(),k=key(d),slot=d.getHours()*6+Math.floor(d.getMinutes()/10);
    return S.blocks.find(b=>b.date===k&&!b.done&&b.start<=slot&&slot<b.start+b.len)}
  function currentMode(now){
    if(celebStart!=null){const per=TIMINGS[S.mascot].complete.reduce((a,b)=>a+b,0)*5;
      while(celebStart!=null&&now-celebStart>=per){queue--;celebStart=queue>0?celebStart+per:null}
      if(celebStart!=null)return 'complete'}
    return nowBlock()?'working':'idle';
  }
  function words(m){
    if(m==='complete')return T('잘했어요! 축하 ','Great work! ')+`${Math.min(5,Math.floor((performance.now()-celebStart)/1500)+1)} / 5`;
    if(m==='working'){const b=nowBlock();return b?T(`함께 진행 중 · ${b.name}`,`Working together · ${b.name}`):T('함께 진행 중','Working together')}
    return T('쉬는 중 · 포인터를 따라봐요','Resting · following your pointer');
  }
  function draw(now){
    const m=currentMode(now);if(m!==mode){mode=m;modeStart=now}
    const c=S.mascot;let frame,shown=m;
    const dt=lastT?Math.min(100,now-lastT):0;lastT=now;place();
    if(m!=='complete'&&now>=pauseUntil){ // walking, bouncing with the working frames
      const step=.046*dt;
      if(Math.abs(target-x)<=step){x=target;pauseUntil=now+3000+Math.random()*6000;target=20+Math.random()*(span()-40)}
      else{x+=target>x?step:-step;box.classList.toggle('flip',target<x)}
      x=Math.max(0,Math.min(span(),x));place();
      if(!walkStart)walkStart=now;shown='working';frame=frameAt(now-walkStart,TIMINGS[c].working);
    }
    else if(m==='idle'){
      box.classList.remove('flip');
      smooth.x+=(pointer.x-smooth.x)*.15;smooth.y+=(pointer.y-smooth.y)*.15;
      const col=smooth.x<-.28?0:smooth.x>.28?2:Math.abs(smooth.x)<.16?1:gazeCol,row=smooth.y<-.28?0:smooth.y>.28?2:Math.abs(smooth.y)<.16?1:gazeRow;
      if(now-lastTurn>=120){if(col!==gazeCol){gazeCol+=Math.sign(col-gazeCol);lastTurn=now}else if(row!==gazeRow){gazeRow+=Math.sign(row-gazeRow);lastTurn=now}}
      frame=gazeRow*3+gazeCol;
      const blink=now%5400;if(frame===4&&col===1&&row===1&&blink<230)frame=blink<70?9:blink<160?10:11;
    }else frame=frameAt(now-(m==='complete'?celebStart:modeStart),TIMINGS[c][m]);
    const sig=c+'/'+shown+'/'+frame;
    if(ready&&lastDraw!==sig&&images[sig]){lastDraw=sig;ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,80,80);ctx.drawImage(images[sig],0,0,80,80)}
    const w=words(m);if(say.textContent!==w)say.textContent=w;
    canvas.setAttribute('aria-label',names()[c]+' · '+w);
  }
  function loop(now){draw(now);if(S.lesser&&!document.hidden)raf=requestAnimationFrame(loop);else raf=0}
  function redraw(){lastDraw='';cancelAnimationFrame(raf);raf=0;
    if(!S.lesser){draw(performance.now())}else raf=requestAnimationFrame(loop)}
  document.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();pointer={x:Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/220)),y:Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/180))}});
  document.addEventListener('visibilitychange',redraw);
  canvas.onclick=()=>window.hanjuChatToggle&&window.hanjuChatToggle();
  function swap(){S.mascot=S.mascot==='planner'?'passion':'planner';save();redraw();toast(T(names()[S.mascot]+'로 바꿨어요','Switched to '+names()[S.mascot]))}
  const pending=[];
  for(const c of Object.keys(TIMINGS))for(const m of ['idle','working','complete'])for(let i=0;i<TIMINGS[c][m].length;i++)
    pending.push(new Promise(res=>{const im=new Image();im.onload=()=>{images[c+'/'+m+'/'+i]=im;res()};im.onerror=res;im.src=`Mascots/${c}/${m}/frame-${String(i+1).padStart(2,'0')}.png`}));
  Promise.all(pending).then(()=>{ready=true;redraw()});
  return {redraw,swap,name:()=>names()[S.mascot],celebrate(){queue++;if(celebStart==null)celebStart=performance.now();redraw()}};
})();
/* ---------- 레서와 대화: 내 API 키 → Apple 기기 안 모델 → 대본 레서 ---------- */
const clock=s=>String(Math.floor(s/6)).padStart(2,'0')+':'+String((s%6)*10).padStart(2,'0'); // 도구용 24시간 표기
function slotOf(t){ // "15:00", "15", "3pm", "오후 3시 30분" → 10분 칸
  t=String(t||'').trim().toLowerCase().replace(/\s+/g,'');if(!t)return null;let m,h,mi=0,pm=/pm|오후|저녁|밤/.test(t),am=/am|오전|새벽|아침/.test(t);
  t=t.replace(/am|pm|오전|오후|저녁|밤|새벽|아침/g,'');
  if(m=t.match(/^(\d{1,2}):(\d{2})$/)){h=+m[1];mi=+m[2]}else if(m=t.match(/^(\d{1,2})(?:시|h)?(?:(\d{1,2})분?|반)?$/)){h=+m[1];mi=t.includes('반')?30:m[2]?+m[2]:0}else return null;
  if(pm&&h<12)h+=12;if(am&&h===12)h=0;if(h>24||mi>59)return null;return Math.min(143,h*6+Math.floor(mi/10))}
const validDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(String(d||''))&&!isNaN(new Date(d+'T00:00'));
function dateRange(from,to){const out=[],a=new Date(from+'T00:00'),b=new Date(to+'T00:00');for(let d=new Date(a);d<=b&&out.length<62;d.setDate(d.getDate()+1))out.push(key(d));return out}
const asItem=(b,k)=>({id:b.id,name:b.name,date:k,start:clock(b.start),end:clock(b.start+b.len),minutes:b.len*10,done:!!b.done,repeat_weekly:!!b.fixed});
function toolList(a){const from=validDate(a.from)?a.from:key(today()),to=validDate(a.to)?a.to:from;
  const blocks=[];for(const k of dateRange(from,to<from?from:to))for(const b of onDay(k).sort((x,y)=>x.start-y.start))blocks.push(asItem(b,k));return {from,to,blocks}}
function freeOn(date,len,after){for(let s=Math.max(FROM(),after||0);s+len<=TO();s++)if(fits(date,s,len))return s;for(let s=0;s+len<=144;s++)if(fits(date,s,len))return s;return null}
function toolAdd(a){const name=String(a.name||'').trim().slice(0,40);if(!name)return {error:T('할 일 이름이 필요해요','A task name is required')};
  const date=validDate(a.date)?a.date:key(today()),len=Math.max(1,Math.min(144,Math.ceil((+a.minutes||60)/10)));
  let s=a.start!=null&&a.start!==''?slotOf(a.start):null;
  if(a.start&&s==null)return {error:T('시간을 못 알아들었어요: ','Could not read the time: ')+a.start};
  if(s!=null&&!fits(date,s,len)){const o=onDay(date).find(o=>o.start<s+len&&s<o.start+o.len);return {error:T('그 시간엔 이미 블록이 있어요','That time is already taken'),conflict:o?asItem(o,date):null}}
  if(s==null){s=freeOn(date,len);if(s==null)return {error:T('그날 빈칸이 없어요','No free slot that day')}}
  let b;if(a.repeat_weekly){b={id:uid(),name,len,wd:wdOf(date),start:s,fixed:true};S.fixed.push(b)}else{b={id:uid(),name,len,c:(S.n%7)+1,date,start:s,done:false};S.n++;S.blocks.push(b)}
  save();showDate(date);render(b.id);return {ok:true,added:asItem(b,date)}}
function pick(a){if(a.id){const b=find(a.id);if(b)return b}
  const q=String(a.name||'').trim().toLowerCase();if(!q)return null;const pool=S.blocks.filter(b=>!validDate(a.date)||b.date===a.date);
  return pool.find(b=>b.name.toLowerCase()===q)||pool.filter(b=>b.name.toLowerCase().includes(q)).sort((x,y)=>Math.abs(new Date(x.date)-today())-Math.abs(new Date(y.date)-today()))[0]||null}
